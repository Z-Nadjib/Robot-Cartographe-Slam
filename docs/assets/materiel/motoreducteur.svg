    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f7"/><stop offset=".45" stop-color="#b9c2c6"/><stop offset=".55" stop-color="#9aa5aa"/><stop offset="1" stop-color="#d7dde0"/></linearGradient>
