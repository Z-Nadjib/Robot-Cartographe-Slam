<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Ce que contient le dépôt">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03111C"/><stop offset="0.55" stop-color="#072833"/>
      <stop offset="1" stop-color="#0A3433"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5EEAD4" opacity="0.10"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2C4A57"/></marker></defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#dots)"/>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.200;1" dur="0.75s" fill="freeze"/><rect x="30" y="24" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="30" y="24" width="4" height="150" rx="2" fill="#E88C55"/><rect x="56" y="72" width="16" height="20" rx="2" fill="none" stroke="#E88C55" stroke-width="2"/><line x1="60" x2="68" y1="78" y2="78" stroke="#E88C55" stroke-width="1.6" opacity="0.8"/><line x1="60" x2="68" y1="82" y2="82" stroke="#E88C55" stroke-width="1.6" opacity="0.8"/><line x1="60" x2="68" y1="86" y2="86" stroke="#E88C55" stroke-width="1.6" opacity="0.8"/><text x="110" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">Un manuel, un seul fichier</text><text x="56" y="126" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">index.html s&#x27;ouvre dans le navigateur, sans</text><text x="56" y="147" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">serveur : schémas, brochage, protocole et</text><text x="56" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">checklists mémorisées d&#x27;une séance à l&#x27;autre.</text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.250;1" dur="0.93s" fill="freeze"/><rect x="440" y="24" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="440" y="24" width="4" height="150" rx="2" fill="#3B82F6"/><circle cx="470" cy="82" r="3.5" fill="#3B82F6" opacity="1.00"/><circle cx="479" cy="82" r="3.5" fill="#3B82F6" opacity="0.88"/><circle cx="488" cy="82" r="3.5" fill="#3B82F6" opacity="0.76"/><circle cx="497" cy="82" r="3.5" fill="#3B82F6" opacity="0.64"/><circle cx="506" cy="82" r="3.5" fill="#3B82F6" opacity="0.52"/><text x="520" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">14 TPs guidés, pas à pas</text><text x="466" y="126" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">Objectif, câblage, code complet, critères</text><text x="466" y="147" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">de validation chiffrés, pièges fréquents</text><text x="466" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">et checklist pour chaque séance.</text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.300;1" dur="1.11s" fill="freeze"/><rect x="850" y="24" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="850" y="24" width="4" height="150" rx="2" fill="#2DD4BF"/><rect x="876" y="74" width="14" height="14" rx="3" fill="#E88C55"/><path d="M893,81 L901,81" stroke="#2DD4BF" stroke-width="2"/><rect x="903" y="74" width="14" height="14" rx="3" fill="#2DD4BF"/><text x="930" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">Sur table, puis sur la voiture</text><text x="876" y="126" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">Chaque brique est validée seule sur</text><text x="876" y="147" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">plaque d&#x27;essai (phase A) avant d&#x27;être</text><text x="876" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">assemblée sur le châssis (phase B).</text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.350;1" dur="1.29s" fill="freeze"/><rect x="30" y="186" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="30" y="186" width="4" height="150" rx="2" fill="#E88C55"/><rect x="59" y="235" width="16" height="16" rx="2" fill="none" stroke="#E88C55" stroke-width="2"/><line x1="56" x2="59" y1="239" y2="239" stroke="#E88C55" stroke-width="1.6"/><line x1="75" x2="78" y1="239" y2="239" stroke="#E88C55" stroke-width="1.6"/><line x1="56" x2="59" y1="243" y2="243" stroke="#E88C55" stroke-width="1.6"/><line x1="75" x2="78" y1="243" y2="243" stroke="#E88C55" stroke-width="1.6"/><line x1="56" x2="59" y1="247" y2="247" stroke="#E88C55" stroke-width="1.6"/><line x1="75" x2="78" y1="247" y2="247" stroke="#E88C55" stroke-width="1.6"/><text x="110" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">Firmware ESP32 temps réel</text><text x="56" y="288" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">Régulateur PI à 50 Hz, encodeurs x4 sur</text><text x="56" y="309" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">interruptions, balayage non bloquant</text><text x="56" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">et chien de garde de 500 ms.</text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.400;1" dur="1.47s" fill="freeze"/><rect x="440" y="186" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="440" y="186" width="4" height="150" rx="2" fill="#3B82F6"/><rect x="466" y="234" width="6" height="6" rx="1" fill="#3B82F6" opacity="0.9"/><rect x="473" y="234" width="6" height="6" rx="1" fill="#3B82F6" opacity="0.3"/><rect x="480" y="234" width="6" height="6" rx="1" fill="#3B82F6" opacity="0.9"/><rect x="466" y="241" width="6" height="6" rx="1" fill="#3B82F6" opacity="0.3"/><rect x="473" y="241" width="6" height="6" rx="1" fill="#3B82F6" opacity="0.3"/><rect x="480" y="241" width="6" height="6" rx="1" fill="#3B82F6" opacity="0.9"/><rect x="466" y="248" width="6" height="6" rx="1" fill="#3B82F6" opacity="0.9"/><rect x="473" y="248" width="6" height="6" rx="1" fill="#3B82F6" opacity="0.3"/><rect x="480" y="248" width="6" height="6" rx="1" fill="#3B82F6" opacity="0.3"/><text x="520" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">SLAM léger en Python</text><text x="466" y="288" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">Odométrie, grille d&#x27;occupation, filtre</text><text x="466" y="309" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">de Kalman étendu et marqueurs ArUco,</text><text x="466" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">avec numpy et OpenCV seulement.</text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.450;1" dur="1.65s" fill="freeze"/><rect x="850" y="186" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="850" y="186" width="4" height="150" rx="2" fill="#2DD4BF"/><path d="M876,250 L884,242 L892,246 L902,236" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="3 3"/><circle cx="876" cy="250" r="3" fill="#2DD4BF"/><circle cx="902" cy="236" r="3.5" fill="#E88C55"/><text x="930" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">Navigation multi-points</text><text x="876" y="288" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">On clique des buts sur la carte : A*</text><text x="876" y="309" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">sur les obstacles gonflés, suivi du</text><text x="876" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">chemin et balayage à chaque arrivée.</text></g>
</svg>
