# Publie le manuel (index.html) sur GitHub Pages à chaque push sur main
name: Manuel en ligne

on:
  push:
    branches: [main]
    paths: [index.html, docs/assets/materiel/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir -p _site/docs/assets
          cp index.html _site/
          cp -r docs/assets/materiel _site/docs/assets/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
